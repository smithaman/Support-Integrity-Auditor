#     - issue_category
#     - assigned_priority
    # resolution_time excluded — prevents pseudo-label leakage

classifier:
  model_name:           microsoft/deberta-v3-small
  num_labels:           2
  max_length:           512
  train_batch_size:     16
  eval_batch_size:      32
  learning_rate:        1.0e-5    # was 2e-5 — halved for stability
  weight_decay:         0.01
  num_epochs:           5
  warmup_ratio:         0.15      # was 0.10 — longer warmup for stability
  save_dir:             outputs/models/deberta_classifier/
  seed:                 42
  metric_for_best:      macro_f1
  prediction_threshold: 0.5
  input_features:
    - channel
    - tier
    - issue_category
    - assigned_priority


# ── Class Imbalance ───────────────────────────────────────────
# imbalance:
#   strategy:         weighted_loss        # weighted_loss | smote | oversample
#   auto_compute:     true                 # compute weights from label distribution

imbalance:
  strategy:       weighted_loss
  auto_compute:   true
  manual_weights:           # override auto if needed
    consistent: 0.5         # down-weight majority
    mismatch:   3.5         # up-weight minority harder

# ── FAISS ─────────────────────────────────────────────────────
faiss:
  index_type:       IndexFlatIP          # inner product on normalized = cosine sim
  index_path:       outputs/faiss_index/sia_tickets.index
  embeddings_path:  outputs/faiss_index/ticket_embeddings.npy
  metadata_path:    outputs/faiss_index/ticket_metadata.json
  top_k:            5

# ── Dossier ───────────────────────────────────────────────────
dossier:
  output_path:      outputs/dossiers/evidence_dossiers.json
  max_keywords:     3
  verify:           true                 # run hallucination verification on every dossier

# ── Evaluation ────────────────────────────────────────────────
evaluation:
  metrics_path:           outputs/metrics/evaluation.json
  confusion_matrix_path:  outputs/metrics/confusion_matrix.png
  thresholds:
    accuracy:             0.83
    macro_f1:             0.82
    per_class_recall:     0.78

# ── Adversarial Testing ───────────────────────────────────────
adversarial:
  num_cases:        10
  pass_threshold:   7                    # ≥7/10 → 10% bonus

# ── Logging ───────────────────────────────────────────────────
logging:
  level:      INFO
  log_dir:    outputs/logs/
  log_file:   outputs/logs/sia.log
# ─────────────────────────────────────────
#  SIA — Support Integrity Auditor
#  Central Configuration File
# ─────────────────────────────────────────

# ── Paths ────────────────────────────────────────────────────
data:
  raw_path:           data/raw/customer_support_tickets.csv
  processed_path:     data/processed/tickets_processed.csv
  pseudo_labels_path: data/processed/pseudo_labels.csv
  train_path:         data/processed/train.csv
  val_path:           data/processed/val.csv
  test_path:          data/processed/test.csv
  cache_dir:          data/cache/

# ── Preprocessing ─────────────────────────────────────────────
preprocessing:
  max_text_length:  512
  test_size:        0.15
  val_size:         0.15
  random_seed:      42
  strip_noise:      true       # strip filler sentences from descriptions
  noise_pattern:    '\b([A-Z][a-z]+ ){2,5}[a-z]+\.\s*$'

# ── Embeddings ────────────────────────────────────────────────
embeddings:
  model_name:   BAAI/bge-small-en-v1.5   # swap to bge-base-en-v1.5 for +accuracy
  batch_size:   64
  normalize:    true
  save_path:    outputs/embeddings/ticket_embeddings.npy
  cache_path:   data/cache/embeddings_cache.npy

# ── Signal 1 — Semantic Severity ──────────────────────────────
signal1:
  method:             anchor_similarity   # cosine sim vs severity anchors
  scoring:            soft                # soft weighted score, not hard argmax
  use_category_bias:  true                # boost score using Issue_Category
  category_bias_weight: 0.2              # 20% weight to category bias

# ── Signal 2 — Resolution Time Severity ───────────────────────
signal2:
  method:     continuous                 # continuous percentile scale (not hard bins)
  clip_lower: 0.05                       # clip bottom 5% outliers
  clip_upper: 0.95                       # clip top 5% outliers

# ── Signal Fusion ─────────────────────────────────────────────
# fusion:
#   semantic_weight:    0.7
#   resolution_weight:  0.3
#   mismatch_threshold: 1.5                # |inferred - assigned| >= 1.5 → Mismatch
#   target_mismatch_rate:                  # expected pseudo-label mismatch %
#     min: 0.20
#     max: 0.40

fusion:
  semantic_weight:    0.6    # was 0.7 — reduce slightly since NLP already in S1
  resolution_weight:  0.4    # was 0.3 — increase since RT is still valuable
  mismatch_threshold: 1.2    # was 1.5 — lower slightly for better spread
  target_mismatch_rate:
    min: 0.15
    max: 0.40

# ── Pseudo Labels ─────────────────────────────────────────────
pseudo_labels:
  threshold:        1.5
  save_signals:     true                 # save individual signal scores for ablation

